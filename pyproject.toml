[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-concierge-agent"
version = "1.0.0"
description = "Production-grade Personal Travel & Budget Concierge Agent built with Google ADK, Strategic Model Routing, Guardrails, HITL, Persistent Memory, and OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Travel Concierge Agent Engineering" }
]
keywords = [
  "google-adk",
  "vertex-ai",
  "gemini",
  "agentops",
  "multi-agent",
  "opentelemetry",
]
dependencies = [
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "pydantic>=2.7.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-discoveryengine>=0.11.0",
  "google-cloud-dlp>=3.18.0",
  "google-cloud-logging>=3.10.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["travel_concierge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F541"]
